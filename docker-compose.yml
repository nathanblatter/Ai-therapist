services:
  app:
    build: .
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: 3067
      # Connects to the shared Postgres in ~/docker-services via the host gateway.
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:5432/ai_therapist
      DATABASE_SSL: "false"
      SESSION_SECRET: ${SESSION_SECRET}
      CORS_ORIGIN: https://ai-therapist.nathanblatter.com
      # Magic-link demo access. Unset => /demo/:token 404s (feature disabled).
      DEMO_MAGIC_TOKEN: ${DEMO_MAGIC_TOKEN}
      # Stage is the public demo: keep the demo pill/overlay + [DEMO] titles.
      # Prod (docker-compose.prod.yml) leaves this unset and serves clean HTML.
      DEMO_SITE: "true"
      # Automatic evals (nightly harness scheduler + session-end auto-eval)
      # run ONLY on stage. Prod leaves this unset — no judge spend, no eval
      # load competing with live sessions; manual evals still work there.
      EVALS_ENABLED: "true"
      # OpenAI Realtime API key
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      FLIGHTDECK_URL: ${FLIGHTDECK_URL:-http://flightdeck:8080}
      FLIGHTDECK_INGEST_KEY: ${FLIGHTDECK_INGEST_KEY}
      # Object storage for session recordings. Endpoint is hardcoded (not
      # interpolated) so the host .env's local-dev value (127.0.0.1:9000) can't
      # leak in — the container reaches MinIO by service name on the shared
      # docker-services network. Only the credentials come from .env.
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ai-therapist-recordings
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Crisis paging via the local iMessage HTTP API (same service
      # personal-site uses; reachable at the host's Tailscale IP).
      IMESSAGE_API_URL: ${IMESSAGE_API_URL:-http://100.79.61.79:8899}
      IMESSAGE_API_KEY: ${IMESSAGE_API_KEY}
      CRISIS_ALERT_PHONE: ${CRISIS_ALERT_PHONE}
    networks:
      - default
      - flightdeck
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3067/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 40s

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app

networks:
  flightdeck:
    external: true
    name: docker-services_default
