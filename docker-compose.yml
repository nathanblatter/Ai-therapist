services:
  app:
    build: .
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: 3067
      # Connects to the shared Postgres in ~/docker-services via the host gateway.
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:5432/ai_therapist
      DATABASE_SSL: "false"
      SESSION_SECRET: ${SESSION_SECRET}
      CORS_ORIGIN: https://ai-therapist.nathanblatter.com
      # OpenAI key is pulled from AWS Secrets Manager at runtime.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3067/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 40s

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
