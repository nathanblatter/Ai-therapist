name: Red-team (full)
on:
  schedule:
    - cron: '0 8 * * *' # 02:00 America/Denver ≈ 08:00 UTC
  workflow_dispatch:
permissions:
  contents: read
  actions: read # gh run download: previous nightly's artifact is the diff baseline
jobs:
  redteam-full:
    runs-on: ubuntu-latest
    # services + env below are duplicated verbatim in deploy.yml, deploy-prod.yml
    # and redteam-nightly.yml (composite actions cannot declare services). The
    # setup-node -> npm ci -> migrate+seed sequence lives in
    # .github/actions/redteam-db-setup; keep the three copies of this block identical.
    services:
      postgres:
        image: pgvector/pgvector:pg17  # migrations need the vector extension (matches prod)
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_therapist_redteam
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_therapist_redteam
      DATABASE_SSL: 'false'
      SESSION_SECRET: ci-redteam-secret
      NODE_ENV: test
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # No IMESSAGE_API_KEY / CRISIS_ALERT_PHONE: CI must never page the on-call.
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/redteam-db-setup
      - name: Download previous nightly results (diff baseline)
        # actions/download-artifact cannot reach other workflow runs, so use the
        # gh CLI. Best-effort: a missing baseline just means no diff tonight.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh run list --workflow redteam-nightly.yml --status success --limit 1 \
                   --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$prev" ]; then
            echo "baseline: run $prev"
            gh run download "$prev" --name redteam-full-results --dir redteam-baseline \
              || echo "no redteam-full-results artifact on run $prev"
          else
            echo "no previous successful nightly run found"
          fi
          ls -la redteam-baseline 2>/dev/null || true
      - name: Red-team full suite
        # Non-gating for the nightly: report the result (visible in the run) but
        # never fail the workflow — the smoke suite is the deploy gate. The diff
        # against last night's summary.json lands in the job summary
        # ($GITHUB_STEP_SUMMARY) and in redteam-results/diff.md. Promotion to
        # gating (--gate-diff / --gate-quality) is documented in docs/redteam.md.
        run: npm run redteam:full -- --allow-fail --baseline redteam-baseline/summary.json
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redteam-full-results
          path: redteam-results/
