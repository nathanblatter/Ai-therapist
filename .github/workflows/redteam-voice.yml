name: Red-team (voice, GPT-Live)
# The voice-safety red-team suite on the GPT-Live path real participants use: a
# headless participant browser (werift WebRTC + WASM Opus) speaks TTS persona
# turns into a real gpt-live-1 session minted by our POST /api/live/session,
# the sideband scores and persists them, and the harness asserts on the result
# (src/redteam/scenarios/voice.ts, src/redteam/liveVoiceChecks.ts).
#
# Separate from redteam-nightly.yml on purpose: each scenario is minutes of
# wall clock and bills per voice minute. Cost and schedule: see docs/redteam.md
# "Voice suite in CI". Never a deploy gate.
#
# GPT-Live evaluation guide modes (docs/redteam.md "GPT-Live evaluation
# guide"): the weekly run adds CRAWL (single spoken turns at critical points,
# three repeats for P50/P90). WALK (acoustic conditions) and RUN (simulated
# participant, full duplex) run on demand only: pick them with `mode`.
#
# `mode: opening` (on demand only) is the silent-start measurement of
# ai-therapist-315: `repeats` ordinary starts that speak the opening and end
# (src/redteam/voice/openingOnly.ts, about $0.03 each), under the delivery
# `opening_delivery` picks. Run it once per delivery to compare them.
on:
  schedule:
    - cron: '0 9 * * 0' # weekly, Sunday 09:00 UTC (03:00 America/Denver)
  workflow_dispatch:
    inputs:
      mode:
        description: 'weekly (voice-safety + crawl), safety, crawl, walk, run, all, or opening (opening-only starts; not part of all)'
        required: false
        default: weekly
        type: choice
        options: [weekly, safety, crawl, walk, run, all, opening]
      repeats:
        description: 'Repeats per crawl / walk / run scenario (P50/P90 need at least 3); for opening, the number of starts (20 or more)'
        required: false
        default: '3'
      opening_delivery:
        description: 'GPT-Live ordinary opening delivery (LIVE_OPENING_DELIVERY): instructions (the default) or recipe (developer message + commentary; ai-therapist-315 measurement)'
        required: false
        default: instructions
        type: choice
        options: [instructions, recipe]
permissions:
  contents: read
concurrency:
  group: redteam-voice
  cancel-in-progress: false
jobs:
  redteam-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # services + env below are duplicated verbatim in deploy.yml, deploy-prod.yml
    # and redteam-nightly.yml (composite actions cannot declare services). The
    # setup-node -> npm ci -> migrate+seed sequence lives in
    # .github/actions/redteam-db-setup; keep the three copies of this block identical.
    # This workflow is a fourth copy of the same block; keep it identical too.
    services:
      postgres:
        image: pgvector/pgvector:pg17  # migrations need the vector extension (matches prod)
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_therapist_redteam
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_therapist_redteam
      DATABASE_SSL: 'false'
      SESSION_SECRET: ci-redteam-secret
      NODE_ENV: test
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # No IMESSAGE_API_KEY / CRISIS_ALERT_PHONE: CI must never page the on-call.
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/redteam-db-setup
      - name: Confirm the voice backend is GPT-Live
        # The voice runner follows system_config.ai_model exactly as production
        # does. A fresh DB migrates to gpt-live-1 (migration 099); fail loudly
        # if that ever changes rather than silently testing another backend.
        run: |
          model=$(psql "$DATABASE_URL" -Atc "SELECT config_value->>'model' FROM system_config WHERE config_key = 'ai_model'")
          echo "system_config.ai_model = ${model:-<unset>}"
          case "$model" in
            gpt-live-*) ;;
            *) echo "::error::ai_model is '${model}', not a gpt-live-* model; this workflow only covers GPT-Live"; exit 1 ;;
          esac
      - name: Red-team voice suites
        id: voice
        # Exit code 1 on any gating failure. Held until the results are
        # uploaded and summarised, then re-raised by the last step. Each suite
        # writes its own results directory, and every suite runs even when an
        # earlier one failed.
        continue-on-error: true
        env:
          REDTEAM_TRIGGER: ci-voice
          MODE: ${{ inputs.mode || 'weekly' }}
          REPEATS: ${{ inputs.repeats || '3' }}
          LIVE_OPENING_DELIVERY: ${{ inputs.opening_delivery || 'instructions' }}
        run: |
          case "$MODE" in
            weekly) suites="voice-safety voice-crawl" ;;
            safety) suites="voice-safety" ;;
            crawl) suites="voice-crawl" ;;
            walk) suites="voice-walk" ;;
            run) suites="voice-run" ;;
            all) suites="voice-safety voice-crawl voice-walk voice-run" ;;
            opening) suites="voice-opening" ;;
            *) echo "::error::unknown mode $MODE"; exit 2 ;;
          esac
          case "$REPEATS" in ''|*[!0-9]*) echo "::error::repeats must be a number"; exit 2 ;; esac
          rc=0
          # The weekly run skips the on-demand-only scenarios (src/redteam/onDemand.ts:
          # the voice heads-up trio, a feature switched off everywhere); `safety` and
          # `all` run them.
          skip=""
          [ "$MODE" = weekly ] && skip="--skip-on-demand"
          for suite in $suites; do
            reps="$REPEATS"
            [ "$suite" = "voice-safety" ] && reps=1
            npx tsx src/redteam/cli.ts --suite "$suite" --variations "$reps" --out "redteam-results/$suite" $skip || rc=1
          done
          exit $rc
      - name: Job summary
        if: always()
        run: |
          found=0
          for f in redteam-results/*/summary.json; do
            [ -f "$f" ] || continue
            found=1
            npx tsx src/redteam/voiceSummary.ts "$f"
          done
          [ "$found" = 1 ] || npx tsx src/redteam/voiceSummary.ts redteam-results/summary.json
          # Opening-only starts: the per-delivery silent-start numbers.
          if [ -f redteam-results/voice-opening/summary.json ]; then
            npx tsx src/redteam/voice/openingReport.ts redteam-results/voice-opening/summary.json
          fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redteam-voice-results
          path: redteam-results/
      - name: Fail on gating assertion failures
        if: steps.voice.outcome != 'success'
        run: |
          echo "::error::voice red-team suite failed (gating assertions or a scenario error); see the job summary and the redteam-voice-results artifact"
          exit 1

  flightdeck-sync:
    # Files NEW eval failures into Flightdeck (src/redteam/flightdeckReport.ts,
    # docs/redteam.md "Eval failures in Flightdeck"). Self-hosted because
    # Flightdeck listens on a Tailscale address GitHub-hosted runners cannot
    # reach. Write-only: the FLIGHTDECK_INGEST_KEY secret is an ingest-scope
    # key (POST /api/ingest/capture only); without it the step prints a notice
    # and does nothing. Never on pull_request, never on another branch.
    #
    # Shared-runner hygiene: the mini's single runner also runs deploy.yml's
    # stage `deploy` job, so this job is short (no npm ci; plain node runs the
    # one dependency-free script from a sparse checkout), uses its own
    # workspace under the runner's _work dir (the deploy job works in
    # ~/deploy/Ai-therapist, not here) and its own concurrency group (never
    # the deploy's). Every step tolerates failure: this job never turns the
    # run red.
    name: file new failures in Flightdeck
    needs: [redteam-voice]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      needs.redteam-voice.result != 'cancelled' && needs.redteam-voice.result != 'skipped'
    runs-on: self-hosted
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # tonight's artifacts + earlier runs' results (the previous result per scenario)
    concurrency:
      group: flightdeck-eval-sync
      cancel-in-progress: false
    env:
      FLIGHTDECK_URL: http://100.79.61.79:4300
      FLIGHTDECK_INGEST_KEY: ${{ secrets.FLIGHTDECK_INGEST_KEY }}
      ARTIFACTS: redteam-voice-results
      WORKFLOW_FILE: redteam-voice.yml
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          sparse-checkout: |
            src/redteam/flightdeckReport.ts
            package.json
          sparse-checkout-cone-mode: false
      - name: Download tonight's results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.ARTIFACTS }}
          path: fd-current
      - name: Download this run's earlier sync state (re-run idempotency)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: flightdeck-sync-state
          path: fd-state
      - name: Download earlier runs' results (previous result per scenario)
        # The previous recorded result decides whether a failure is new (pass ->
        # fail, or no earlier result) or a repeat (fail -> fail, files nothing).
        # Voice runs keep no rolling baseline and the mode varies run to run, so
        # up to 5 earlier runs are read and each scenario's newest result wins.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p fd-previous
          ids=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$WORKFLOW_FILE" --branch main --status completed --limit 10 \
                  --json databaseId,conclusion \
                  --jq '.[] | select(.conclusion == "success" or .conclusion == "failure") | .databaseId' | head -6)
          for id in $ids; do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            gh run download "$id" --repo "$GITHUB_REPOSITORY" --pattern "$ARTIFACTS" --dir "fd-previous/$id" 2>/dev/null || true
          done
          find fd-previous -name summary.json | sort || true
      - name: File new failures
        continue-on-error: true
        run: |
          NODE=/opt/homebrew/opt/node@24/bin/node # not on the runner's PATH (its nvm entry is stale)
          [ -x "$NODE" ] || NODE=$(command -v node || true)
          if [ -z "$NODE" ] || [ ! -f src/redteam/flightdeckReport.ts ]; then
            echo "WARNING: Flightdeck eval sync skipped: node or the script is missing on the self-hosted runner." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          summaries=$(find fd-current -name summary.json 2>/dev/null | sort)
          # No summary at all: the harness never finished. Name the expected
          # file so the script reports it as an infrastructure failure.
          [ -n "$summaries" ] || summaries=fd-current/redteam-voice-results/summary.json
          prev=()
          for d in $(find fd-previous -name summary.json -exec dirname {} \; 2>/dev/null | sort -u); do prev+=(--previous "$d"); done
          "$NODE" src/redteam/flightdeckReport.ts \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --state fd-state/flightdeck-state.json "${prev[@]}" $summaries \
            || echo "WARNING: Flightdeck eval sync exited non-zero; see the step log." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the sync state for a re-run of this run
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: flightdeck-sync-state
          path: fd-state/flightdeck-state.json
          if-no-files-found: ignore
          overwrite: true
