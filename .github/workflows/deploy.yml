name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

  redteam-smoke:
    runs-on: ubuntu-latest
    # Runs in PARALLEL with verify (deploy still needs both): serializing added
    # verify's full duration to every deploy for no protection — a broken build
    # at worst wastes one ~$0.03 smoke run. Wall time ~3min → ~2min.
    services:
      postgres:
        image: pgvector/pgvector:pg17  # migrations need the vector extension (matches prod)
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_therapist_redteam
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_therapist_redteam
      DATABASE_SSL: 'false'
      SESSION_SECRET: ci-redteam-secret
      NODE_ENV: test
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # No IMESSAGE_API_KEY / CRISIS_ALERT_PHONE: CI must never page the on-call.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Set up red-team DB (migrate + seed)
        run: bash scripts/redteam-db-setup.sh
      - name: Red-team smoke suite
        run: npm run redteam:smoke
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redteam-smoke-results
          path: redteam-results/

  deploy:
    needs: [verify, redteam-smoke]
    runs-on: self-hosted
    steps:
      - name: Deploy
        run: |
          # Deploy checkout lives outside iCloud (the Desktop repo suffers EDEADLK evictions mid-deploy)
          cd /Users/nathanblatter/deploy/Ai-therapist
          git pull origin main

          # Build new image
          # Layer cache is safe here: COPY . . invalidates from the source layer
          # onward on any code change, and npm ci re-runs whenever the lockfile
          # changes. If an image ever looks stale, rebuild once with --no-cache.
          docker compose build app

          # Get current running container ID
          OLD_CONTAINER=$(docker compose ps -q app 2>/dev/null | head -1)

          if [ -z "$OLD_CONTAINER" ]; then
            echo "No existing container, starting fresh..."
            docker compose up -d
            exit 0
          fi

          # Scale up: start new container alongside old
          echo "Scaling up to 2 replicas..."
          docker compose up -d --scale app=2 --no-recreate

          # Identify new container
          NEW_CONTAINER=$(docker compose ps -q app | grep -v "^${OLD_CONTAINER}$" | head -1)
          if [ -z "$NEW_CONTAINER" ]; then
            echo "ERROR: Could not identify new container"
            exit 1
          fi
          echo "Old: $OLD_CONTAINER | New: $NEW_CONTAINER"

          # Wait for health check to pass
          echo "Waiting for new container to be healthy..."
          HEALTHY=false
          for i in $(seq 1 40); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$NEW_CONTAINER" 2>/dev/null)
            if [ "$STATUS" = "healthy" ]; then
              HEALTHY=true
              echo "New container is healthy!"
              break
            elif [ "$STATUS" = "unhealthy" ]; then
              echo "ERROR: New container is unhealthy, rolling back..."
              docker stop "$NEW_CONTAINER" && docker rm "$NEW_CONTAINER"
              exit 1
            else
              echo "  Status: ${STATUS:-starting} ($i/40)..."
              sleep 5
            fi
          done

          if [ "$HEALTHY" != "true" ]; then
            echo "ERROR: Health check timed out, rolling back..."
            docker stop "$NEW_CONTAINER" && docker rm "$NEW_CONTAINER"
            exit 1
          fi

          # Stop old container
          echo "Removing old container..."
          docker stop "$OLD_CONTAINER" && docker rm "$OLD_CONTAINER"
          echo "Zero-downtime deploy complete!"
